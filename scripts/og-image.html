<!DOCTYPE html>
<!-- Source for og-image.png, the 1200×630 link-preview image. Regenerate after editing:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
       --window-size=1200,630 --virtual-time-budget=4000 --screenshot=og-image.png scripts/og-image.html
     then give the image a new filename so LinkedIn and others fetch it fresh. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Compute Desk — share image</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#16181d;--ink-2:#5f6670;--rule:#e4e6ea;--compute:#1f9d6b;--network:#eb6834;--money:#6250d6;--down:#c8372d}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#fff}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);padding:64px 72px 56px;display:flex;flex-direction:column}
.word{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:600;letter-spacing:-.01em}
.word svg{width:28px;height:28px;stroke:var(--compute);stroke-width:5;fill:none;stroke-linecap:round}
h1{margin-top:auto;font-size:104px;line-height:1;font-weight:600;letter-spacing:-.045em}
p{margin-top:22px;font-size:32px;line-height:1.35;color:var(--ink-2);letter-spacing:-.01em;max-width:900px}
.sections{display:flex;gap:34px;margin-top:auto;padding-top:24px;border-top:1px solid var(--rule);font-size:22px;font-weight:500}
.sections span{display:flex;align-items:center;gap:10px}
.sections i{width:14px;height:14px;border-radius:4px}
.url{margin-left:auto;color:var(--ink-2);font-weight:400}
</style>
</head>
<body>
  <div class="word"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 11v42M11 32h42M17 17l30 30M17 47l30-30"/></svg>The Compute Desk</div>
  <h1>Buying AI compute.</h1>
  <p>What you rent, where the time goes, what you pay, and what the contract covers.</p>
  <div class="sections">
    <span><i style="background:var(--compute)"></i>Hardware</span>
    <span><i style="background:var(--network)"></i>Networks</span>
    <span><i style="background:var(--money)"></i>Prices</span>
    <span><i style="background:var(--down)"></i>Contracts</span>
    <span class="url">compute.alexkyen.com</span>
  </div>
</body>
</html>
